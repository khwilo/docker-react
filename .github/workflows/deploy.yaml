name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image for tests
        run: docker build -t khwilo/frontend-test -f Dockerfile.dev .

      - name: Run tests
        run: docker run --rm -e CI=true khwilo/frontend-test npm test -- --coverage

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate Dockerfile (build image)
        run: |
          echo "Building Docker image to validate Dockerfile"
          docker build -f Dockerfile -t frontend-ci-validate .

      - name: Run built container and smoke test
        run: |
          echo "Starting container to run smoke test"
          docker run -d --name frontend-ci-validate-run -p 8080:80 frontend-ci-validate
          sleep 5
          if ! curl -sSf http://localhost:8080/ > /dev/null; then
            echo "Smoke test failed — printing container logs" >&2
            docker logs frontend-ci-validate-run || true
            docker rm -f frontend-ci-validate-run || true
            exit 1
          fi
          docker rm -f frontend-ci-validate-run

      - name: Zip source bundle
        run: zip -r deploy.zip . -x '.git/*' 'node_modules/*' 'build.zip' 'deploy.zip'

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: frontend
          environment_name: Frontend-env
          existing_bucket_name: elasticbeanstalk-us-east-1-851725511365
          region: us-east-1
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
